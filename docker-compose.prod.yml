services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile.aws
    container_name: scoresentinel-api
    expose:
      - "5000"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./feeds:/app/feeds
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; r = urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5); sys.exit(0 if r.status == 200 else 1)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2
    container_name: scoresentinel-caddy
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    environment:
      - API_DOMAIN=${API_DOMAIN:-api.chainsutra.in}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
