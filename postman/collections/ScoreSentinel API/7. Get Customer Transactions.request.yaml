$kind: http-request
url: http://localhost:5000/api/transactions?customer_id=CUST-TEST-001
method: GET
queryParams:
  customer_id: CUST-TEST-001
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Correct customer filtered", function () {
          var jsonData = pm.response.json();
          if (jsonData.transactions.length > 0) {
              pm.expect(jsonData.transactions[0].customer_id).to.eql("CUST-TEST-001");
          }
      });
    language: text/javascript
order: 7000
